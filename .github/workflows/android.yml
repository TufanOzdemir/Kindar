name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  # Her derlemede artan sürüm kodu. Android yalnızca daha yüksek sürüm kodlu APK'yı
  # eskisinin üzerine kurar.
  VERSION_CODE: ${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Veritabanı şeması repoda mı?
        # Room her derlemede şemayı app/schemas altına yazar. Dosya repodakinden farklıysa şema
        # değişmiştir: sürüm arttırılmalı, göç yazılmalı ve yeni şema dosyası commit edilmelidir.
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          changed = subprocess.run(["git", "ls-files", "--others", "--modified", "app/schemas"],
                                   capture_output=True, text=True, check=True).stdout.split()
          bad = []
          for f in changed:
              old = subprocess.run(["git", "show", f"HEAD:{f}"], capture_output=True, text=True)
              if old.returncode != 0 or json.loads(old.stdout) != json.load(open(f)):
                  bad.append(f)
          if bad:
              print("::error::Room şeması değişti ya da repoda yok. Bu dosyaları commit edin ve gerekiyorsa Migration ekleyin.")
              for f in bad:
                  print("-----", f)
                  print(open(f).read())
              sys.exit(1)
          print("Şemalar repodakiyle aynı.")
          PY

      - name: İmza anahtarını hazırla
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KINDAR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KINDAR_KEYSTORE_BASE64 secret'ı yok; release APK imzasız derlenecek ve yayınlanmayacak."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kindar-release.jks"
            echo "KINDAR_KEYSTORE_FILE=$RUNNER_TEMP/kindar-release.jks" >> "$GITHUB_ENV"
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release APK derle
        env:
          KINDAR_KEYSTORE_PASSWORD: ${{ secrets.KINDAR_KEYSTORE_PASSWORD }}
          KINDAR_KEY_ALIAS: ${{ secrets.KINDAR_KEY_ALIAS }}
          KINDAR_KEY_PASSWORD: ${{ secrets.KINDAR_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: GitHub Release olarak yayınla
        # Yalnızca main dalında ve imza varken. Diğer dallarda elle tetiklenen derlemeler yayınlanmaz.
        if: steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="0.1.${VERSION_CODE}"
          APK="kindar-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          gh release create "v${VERSION}" "$APK" \
            --target "$GITHUB_SHA" \
            --title "Kindar ${VERSION}" \
            --notes "Telefonda bu APK'yı açıp kurun. Önceki Kindar sürümünün üzerine kurulur, veriler korunur. Commit: ${GITHUB_SHA::7}"

      - name: Geçici anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/kindar-release.jks"
